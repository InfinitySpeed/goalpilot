<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">GoalPilot 1.11 vs Codex native on identical tasks</title><desc id="desc">Equal-weight means across Java, TypeScript and Flowdesk, with two fresh runs per task and arm. GoalPilot used 16.5 percent fewer uncached tokens and 35.5 percent less elapsed time, with six of six task checks passed in both arms.</desc><rect width="1100" height="560" rx="26" fill="#0b1220"/><text x="56" y="70" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="700">Same tasks. Same Codex model. Two runs each.</text><text x="56" y="108" fill="#aab7cb" font-family="Arial,sans-serif" font-size="17">Equal-weight task-family means · 6 runs per arm · gpt-6.1-sol · low effort</text><text x="56" y="170" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="18" font-weight="700">Uncached input + output tokens per caller</text><rect x="56" y="195" width="750" height="32" rx="8" fill="#263247"/><rect x="56" y="195" width="750" height="32" rx="8" fill="#64748b"/><text x="824" y="219" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Codex native · 13,027</text><rect x="56" y="241" width="750" height="32" rx="8" fill="#263247"/><rect x="56" y="241" width="626" height="32" rx="8" fill="#2dd4bf"/><text x="700" y="265" fill="#99f6e4" font-family="Arial,sans-serif" font-size="17">GoalPilot · 10,875</text><text x="900" y="251" fill="#5eead4" font-family="Arial,sans-serif" font-size="22" font-weight="700">−16.5%</text><text x="56" y="328" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="18" font-weight="700">Elapsed time per caller</text><rect x="56" y="353" width="750" height="32" rx="8" fill="#64748b"/><text x="824" y="377" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Codex native · 99.25 s</text><rect x="56" y="399" width="750" height="32" rx="8" fill="#263247"/><rect x="56" y="399" width="484" height="32" rx="8" fill="#2dd4bf"/><text x="558" y="423" fill="#99f6e4" font-family="Arial,sans-serif" font-size="17">GoalPilot · 64.07 s</text><text x="900" y="409" fill="#5eead4" font-family="Arial,sans-serif" font-size="22" font-weight="700">−35.4%</text><rect x="56" y="470" width="988" height="54" rx="12" fill="#132238"/><text x="78" y="505" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Independent task checks: Codex native 6/6 · GoalPilot 6/6</text><text x="56" y="546" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Cache could not be disabled; raw token counts are not used as subscription-quota savings.</text></svg>