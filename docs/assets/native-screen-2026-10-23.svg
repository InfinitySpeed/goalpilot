<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="t d"><title id="t">GoalPilot 1.11 rapid task-diversity screen against native Codex</title><desc id="d">On three fresh paired synthetic tasks, GoalPilot was 28 percent faster but used 9.2 percent more uncached tokens on equal-weight means. All tasks passed in both arms.</desc><rect width="1100" height="690" rx="24" fill="#0b1220"/><text x="48" y="62" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">Fast follow-up screen · one fresh run per arm and task</text><text x="48" y="97" fill="#9caec6" font-family="Arial,sans-serif" font-size="16">Same model / effort · independent judge passed 3/3 in both arms · not a full benchmark</text><text x="48" y="152" fill="#dbeafe" font-family="Arial,sans-serif" font-size="18" font-weight="700">Uncached input + output tokens (lower is better)</text><text x="48" y="196" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Java ranges</text><rect x="190" y="174" width="245" height="18" rx="6" fill="#64748b"/><text x="445" y="189" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">Native 8,409</text><rect x="190" y="201" width="183" height="18" rx="6" fill="#2dd4bf"/><text x="383" y="216" fill="#99f6e4" font-family="Arial,sans-serif" font-size="14">GoalPilot 6,293</text><text x="680" y="200" fill="#5eead4" font-family="Arial,sans-serif" font-size="16" font-weight="700">−25.2%</text><text x="48" y="260" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Node pool</text><rect x="190" y="238" width="201" height="18" rx="6" fill="#64748b"/><text x="401" y="253" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">Native 6,905</text><rect x="190" y="265" width="237" height="18" rx="6" fill="#2dd4bf"/><text x="437" y="280" fill="#99f6e4" font-family="Arial,sans-serif" font-size="14">GoalPilot 8,141</text><text x="680" y="264" fill="#fbbf24" font-family="Arial,sans-serif" font-size="16" font-weight="700">+17.9%</text><text x="48" y="324" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Python planner</text><rect x="190" y="302" width="143" height="18" rx="6" fill="#64748b"/><text x="343" y="317" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">Native 4,916</text><rect x="190" y="329" width="223" height="18" rx="6" fill="#2dd4bf"/><text x="423" y="344" fill="#99f6e4" font-family="Arial,sans-serif" font-size="14">GoalPilot 7,664</text><text x="680" y="328" fill="#fbbf24" font-family="Arial,sans-serif" font-size="16" font-weight="700">+55.9%</text><text x="48" y="405" fill="#dbeafe" font-family="Arial,sans-serif" font-size="18" font-weight="700">Elapsed seconds (lower is better)</text><text x="48" y="449" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Java ranges</text><rect x="190" y="427" width="222" height="18" rx="6" fill="#64748b"/><text x="422" y="442" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">Native 57.68 s</text><rect x="190" y="454" width="148" height="18" rx="6" fill="#2dd4bf"/><text x="348" y="469" fill="#99f6e4" font-family="Arial,sans-serif" font-size="14">GoalPilot 38.42 s</text><text x="680" y="453" fill="#5eead4" font-family="Arial,sans-serif" font-size="16" font-weight="700">−33.4%</text><text x="48" y="513" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Node pool</text><rect x="190" y="491" width="245" height="18" rx="6" fill="#64748b"/><text x="445" y="506" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">Native 63.70 s</text><rect x="190" y="518" width="159" height="18" rx="6" fill="#2dd4bf"/><text x="359" y="533" fill="#99f6e4" font-family="Arial,sans-serif" font-size="14">GoalPilot 41.34 s</text><text x="680" y="517" fill="#5eead4" font-family="Arial,sans-serif" font-size="16" font-weight="700">−35.1%</text><text x="48" y="577" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Python planner</text><rect x="190" y="555" width="150" height="18" rx="6" fill="#64748b"/><text x="350" y="570" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">Native 39.07 s</text><rect x="190" y="582" width="137" height="18" rx="6" fill="#2dd4bf"/><text x="337" y="597" fill="#99f6e4" font-family="Arial,sans-serif" font-size="14">GoalPilot 35.84 s</text><text x="680" y="581" fill="#5eead4" font-family="Arial,sans-serif" font-size="16" font-weight="700">−8.3%</text><rect x="760" y="155" width="292" height="200" rx="18" fill="#132238"/><text x="785" y="193" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Equal-weight mean</text><text x="785" y="235" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Uncached tokens / task</text><text x="785" y="262" fill="#f8fafc" font-family="Arial,sans-serif" font-size="20">Native 6,743</text><text x="785" y="290" fill="#fbbf24" font-family="Arial,sans-serif" font-size="20" font-weight="700">GoalPilot 7,366 · +9.2%</text><text x="785" y="326" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Time / task</text><text x="785" y="349" fill="#f8fafc" font-family="Arial,sans-serif" font-size="17">Native 53.48 s · GoalPilot 38.53 s (−28.0%)</text><rect x="760" y="388" width="292" height="170" rx="18" fill="#132238"/><text x="785" y="428" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Screen decision</text><text x="785" y="463" fill="#fbbf24" font-family="Arial,sans-serif" font-size="17" font-weight="700">Do not expand yet</text><text x="785" y="493" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">All 3 checks pass in both arms;</text><text x="785" y="516" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">GoalPilot closes 3/3. The token</text><text x="785" y="539" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">gate fails on this small sample.</text><text x="48" y="657" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Synthetic screening cases from an existing benchmark suite; one run per arm and case. Cache uncontrolled; no quota claim.</text></svg>