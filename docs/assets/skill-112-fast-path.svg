<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="title desc">
<title id="title">GoalPilot 1.12 fast path compared with Codex native</title>
<desc id="desc">Matched results on two synthetic task families. GoalPilot used 6,350 uncached tokens and 16.29 seconds, compared with Codex native at 9,807 tokens and 20.87 seconds. Each arm passed 4 of 4 independent checks.</desc>
<style>text{font-family:Arial,sans-serif}.title{font-size:23px;font-weight:700;fill:#f8fafc}.subtitle{font-size:14px;fill:#b7c5d8}.label{font-size:13px;fill:#e2e8f0}.value{font-size:13px;font-weight:700;fill:#fff}.metric{font-size:16px;font-weight:700;fill:#dbeafe}.note{font-size:13px;fill:#aab8cc}</style>
<rect width="940" height="360" rx="18" fill="#0b1220"/>
<text x="34" y="42" class="title">GoalPilot 1.12 fast path vs Codex native</text>
<text x="34" y="66" class="subtitle">Two synthetic task families · two fresh runs per arm and family · lower is better</text>
<text x="34" y="115" class="metric">Uncached tokens per task</text>
<text x="34" y="157" class="label">Codex native</text><rect x="150" y="140" width="570" height="24" rx="5" fill="#1e293b"/><rect x="150" y="140" width="428" height="24" rx="5" fill="#64748b"/><text x="590" y="157" class="value">9,807</text>
<text x="34" y="197" class="label">GoalPilot 1.12</text><rect x="150" y="180" width="570" height="24" rx="5" fill="#1e293b"/><rect x="150" y="180" width="277" height="24" rx="5" fill="#2563eb"/><text x="439" y="197" class="value">6,350</text>
<text x="766" y="170" class="metric">−35.3%</text>
<text x="34" y="250" class="metric">Elapsed seconds per task</text>
<text x="34" y="292" class="label">Codex native</text><rect x="150" y="275" width="570" height="24" rx="5" fill="#1e293b"/><rect x="150" y="275" width="475" height="24" rx="5" fill="#64748b"/><text x="637" y="292" class="value">20.87 s</text>
<text x="34" y="332" class="label">GoalPilot 1.12</text><rect x="150" y="315" width="570" height="24" rx="5" fill="#1e293b"/><rect x="150" y="315" width="371" height="24" rx="5" fill="#2563eb"/><text x="533" y="332" class="value">16.29 s</text>
<text x="766" y="305" class="metric">−21.9%</text>
</svg>
