name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline regressions
        run: |
          python validate.py > validation.json || { cat reports/tests.txt; exit 1; }
      - name: Retain offline validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation-${{ matrix.python-version }}
          path: |
            validation.json
            reports/tests.json
            reports/tests.txt
      - name: Recompute benchmark aggregates
        run: python tools/check_benchmark.py
      - name: Build and verify the archived baseline skill
        run: python tools/build_skill.py --legacy
      - name: Build and verify the 0.16.0 portable skill
        run: python tools/build_portable_skill.py
      - name: Build the default portable archive
        run: python tools/build_skill.py
      - name: Audit the full portable-skill comparison
        run: python tools/audit_portable_invocation.py reports/portable-skill-170-2026-10-23.zip --require-promotion
      - name: Audit the frozen standalone promotion
        run: python tools/audit_promoted_release.py
  portable-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check local installation and frozen verification
        run: python -X utf8 tools/smoke_install.py
      - name: Check shell bootstrap
        if: runner.os != 'Windows'
        run: bash bootstrap.sh --source "$PWD" --host generic --target "$RUNNER_TEMP/goalpilot-bootstrap"
      - name: Check PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 -Source $PWD.Path -HostName generic -Target "$env:RUNNER_TEMP/goalpilot-bootstrap" -ManagedPython
      - name: Check PowerShell legacy profile selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 -Source $PWD.Path -HostName generic -Profile legacy -Target "$env:RUNNER_TEMP/goalpilot-legacy-preview" -DryRun
