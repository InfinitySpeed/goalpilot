name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline regressions
        run: python validate.py > validation.json
      - name: Recompute benchmark aggregates
        run: python tools/check_benchmark.py
      - name: Build and verify the portable skill
        run: python tools/build_skill.py
  portable-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check local installation and frozen verification
        run: python -X utf8 tools/smoke_install.py
      - name: Check shell bootstrap
        if: runner.os != 'Windows'
        run: bash bootstrap.sh --source "$PWD" --host generic --target "$RUNNER_TEMP/goalpilot-bootstrap"
      - name: Check PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 -Source $PWD.Path -HostName generic -Target "$env:RUNNER_TEMP/goalpilot-bootstrap"
