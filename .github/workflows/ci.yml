name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline regressions
        run: |
          python validate.py > validation.json || { cat reports/tests.txt; exit 1; }
      - name: Retain offline validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation-${{ matrix.python-version }}
          path: |
            validation.json
            reports/tests.json
            reports/tests.txt
      - name: Recompute benchmark aggregates
        run: python tools/check_benchmark.py
      - name: Build and verify the archived baseline skill
        run: python tools/build_skill.py --legacy
      - name: Build and verify the 0.16.0 portable skill
        run: python tools/build_portable_skill.py
      - name: Build the default portable archive
        run: python tools/build_skill.py
      - name: Audit the full portable-skill comparison
        run: python tools/audit_portable_invocation.py reports/portable-skill-170-2026-10-23.zip --require-promotion
      - name: Audit the generalized whole-caller comparison
        run: python tools/audit_generalization.py reports/native-generalization-2026-10-23.json --require-promotion
      - name: Audit the additional whole-caller outcomes and provider receipts
        run: python tools/audit_portability_extension.py reports/portability-extension-2026-10-23.json --evidence reports/portability-extension-2026-10-23.zip
      - name: Audit the historical 1.9 promotion and matched controls
        run: python tools/audit_skill190.py reports/skill-190-2026-10-23.json --evidence reports/skill-190-evidence.zip --require-promotion
      - name: Audit the historical 1.10 raw-token target promotion
        run: python tools/audit_skill110.py reports/skill-110-2026-10-23.json --evidence reports/skill-110-evidence.zip --require-promotion
      - name: Audit the active 1.11 uncached-token promotion
        run: python tools/audit_skill111.py
      - name: Audit the frozen standalone promotion
        run: python tools/audit_promoted_release.py
  portable-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check local installation and frozen verification
        run: python -X utf8 tools/smoke_install.py
      - name: Check shell bootstrap
        if: runner.os != 'Windows'
        run: bash bootstrap.sh --source "$PWD" --host generic --target "$RUNNER_TEMP/goalpilot-bootstrap"
      - name: Check PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 -Source $PWD.Path -HostName generic -Target "$env:RUNNER_TEMP/goalpilot-bootstrap" -ManagedPython
      - name: Check PowerShell legacy profile selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 -Source $PWD.Path -HostName generic -Profile legacy -Target "$env:RUNNER_TEMP/goalpilot-legacy-preview" -DryRun
  verifier-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare the pinned TypeScript compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/goalpilot-typescript" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          echo "$RUNNER_TEMP/goalpilot-typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify eight runtimes through five installed host profiles
        run: python tools/check_portability.py --require-all --output portability.json
      - name: Retain actual compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-portability
          path: portability.json
