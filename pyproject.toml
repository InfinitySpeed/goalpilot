[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goalpilot"
version = "0.16.0"
description = "A skill for coding agents: local verification, focused repairs, and less repeated work"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
goalpilot = "goalpilot.cli:main"

[tool.setuptools.packages.find]
include = ["goalpilot*"]
